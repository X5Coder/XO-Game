<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XO</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #0A0A0A; --surface: #111111; --surface-2: #1E1E1E;
  --border: #2A2A2A; --border-2: #2E2E2E;
  --text: #FFFFFF; --text-dim: #8A8A8A; --text-faint: #555555;
  --gold: #F0C850; --red: #B91C1C;
}
html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  overflow: hidden;
  user-select: none;
  overscroll-behavior: none;
  position: fixed;
  inset: 0;
  width: 100%;
}
body {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 14px;
}

#toolbar {
  width: min(92vw, 420px);
  margin-bottom: 14px;
  padding: 10px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}

#toolbar .brand {
  display: flex;
  align-items: center;
  flex: 1;
  min-width: 0;
}

#toolbar .brand svg {
  height: 22px;
  width: auto;
  display: block;
}

#toolbar .settings-btn {
  width: 34px;
  height: 34px;
  background: var(--surface-2);
  border: 1px solid var(--border-2);
  color: var(--text-dim);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
  transition: all 0.15s;
  padding: 0;
  flex-shrink: 0;
}
#toolbar .settings-btn:hover { background: #252525; color: var(--text); }
#toolbar .settings-btn:active { transform: scale(0.92); }
#toolbar .settings-btn svg { width: 17px; height: 17px; display: block; }

#stats {
  width: min(92vw, 420px);
  margin-bottom: 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  display: flex;
  align-items: stretch;
  padding: 14px 0;
  flex-shrink: 0;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}

.stat {
  flex: 1;
  display: grid;
  grid-template-rows: auto auto;
  justify-items: center;
  align-items: center;
  gap: 6px;
  min-width: 0;
}

.stat .count {
  font-size: 26px;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  text-align: center;
  display: block;
  width: 100%;
  direction: ltr;
}
.stat.win  .count { color: var(--gold); }
.stat.loss .count { color: var(--red); }
.stat.draw .count { color: var(--text); }

.stat .label {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 2.5px;
  padding-left: 2.5px;
  color: var(--text-faint);
  text-transform: uppercase;
  text-align: center;
  display: block;
  width: 100%;
  direction: ltr;
  line-height: 1;
}

.stat.pulse .count { animation: pulseCount 0.35s ease-out; }
@keyframes pulseCount { 0%,100%{transform:scale(1)} 50%{transform:scale(1.3)} }

.stat-divider {
  width: 1px;
  background: var(--border);
  margin: 6px 0;
  align-self: stretch;
  flex-shrink: 0;
}

#game {
  width: min(92vw, 420px);
  aspect-ratio: 1/1;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  gap: 12px;
  padding: 12px;
  background: var(--surface);
  border-radius: 24px;
  border: 1px solid var(--border);
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  position: relative;
  transform: translateZ(0);
  flex-shrink: 0;
}
.cell {
  background: var(--surface-2); border-radius: 16px; cursor: pointer;
  position: relative; overflow: hidden; display: flex; align-items: center;
  justify-content: center; transition: background 0.15s; transform: translateZ(0);
}
.cell:not(.taken):hover { background: #252525; }
.cell:not(.taken):active { background: #2a2a2a; }
.cell.taken { cursor: default; }

.cell .mark {
  width: 62%; height: 62%; display: flex; align-items: center; justify-content: center;
  transform-origin: center; animation: markIn 0.22s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}
@keyframes markIn { from{transform:scale(0)} to{transform:scale(1)} }
.cell .mark svg { width: 100%; height: 100%; display: block; }
.cell.x .mark svg line { stroke: var(--gold); stroke-width: 10; stroke-linecap: round; }
.cell.o .mark svg circle { stroke: var(--text); stroke-width: 10; fill: none; }
.cell.win { background: rgba(240, 200, 80, 0.1) !important; }
.cell.last { background: #252525; }

#game.ai-turn .cell:not(.taken) { animation: idlePulse 1.6s ease-in-out infinite; }
@keyframes idlePulse {
  0%,100%{ background: var(--surface-2); } 50%{ background: #1a1a1a; }
}

#win-line {
  position: absolute; inset: 0; pointer-events: none; z-index: 10;
  width: 100%; height: 100%; opacity: 0; transition: opacity 0.15s;
}
#win-line.show { opacity: 1; }
#win-line line {
  stroke: var(--gold);
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-dasharray: 500;
  stroke-dashoffset: 500;
}
#win-line.show line { animation: drawLine 0.3s ease-out forwards; }
@keyframes drawLine { to { stroke-dashoffset: 0; } }

.cell.cell-out {
  animation: cellOut 0.18s ease-in forwards;
  pointer-events: none;
}
@keyframes cellOut {
  from { opacity: 1; transform: scale(1); }
  to   { opacity: 0; transform: scale(0.6); }
}
.cell.cell-in {
  animation: cellIn 0.38s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}
@keyframes cellIn {
  from { opacity: 0; transform: scale(0.6); }
  to   { opacity: 1; transform: scale(1); }
}

#settings-modal {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  display: flex; align-items: center; justify-content: center;
  z-index: 100; padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.2s;
}
#settings-modal.show { opacity: 1; pointer-events: auto; }
.settings-panel {
  background: #0C0C0C; border: 1px solid var(--border-2); border-radius: 16px;
  padding: 24px; width: 100%; max-width: 340px;
  transform: scale(0.9); transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}
#settings-modal.show .settings-panel { transform: scale(1); }
.settings-panel h2 { font-size: 18px; font-weight: 800; color: var(--text); margin-bottom: 20px; letter-spacing: 1px; }
.settings-panel .row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
.settings-panel .row:last-child { border-bottom: none; }
.settings-panel .row label { font-size: 14px; color: var(--text-dim); }
.settings-panel .row .val { font-size: 14px; font-weight: 700; color: var(--text); }
.settings-panel button {
  width: 100%; margin-top: 20px; padding: 12px; background: var(--surface-2);
  border: 1px solid var(--border-2); border-radius: 10px; color: var(--text);
  font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
  letter-spacing: 1px; transition: background 0.15s;
}
.settings-panel button:hover { background: #252525; }
.settings-panel button:active { transform: scale(0.98); }

#turn-badge {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) scale(1);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 8px 18px;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 2.5px;
  color: var(--text-dim);
  display: none;
  z-index: 50;
  opacity: 1;
  white-space: nowrap;
  will-change: transform, opacity;
}
#turn-badge.show { display: block; }
#turn-badge.you { color: var(--gold); border-color: var(--gold); }
#turn-badge.swap { animation: badgeSwap 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
@keyframes badgeSwap {
  0%   { transform: translateX(-50%) scale(0.3); opacity: 0; }
  70%  { transform: translateX(-50%) scale(1.08); opacity: 1; }
  100% { transform: translateX(-50%) scale(1); opacity: 1; }
}
</style>
</head>
<body>

<div id="toolbar">
  <div class="brand">
    <svg viewBox="0 0 60 32" fill="none" aria-label="XO">
      <line x1="5"  y1="7" x2="25" y2="25" stroke="#F0C850" stroke-width="5.5" stroke-linecap="round"/>
      <line x1="25" y1="7" x2="5"  y2="25" stroke="#F0C850" stroke-width="5.5" stroke-linecap="round"/>
      <circle cx="44" cy="16" r="9.5" stroke="#FFFFFF" stroke-width="5.5" fill="none"/>
    </svg>
  </div>
  <button class="settings-btn" id="settings-btn" aria-label="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>
</div>

<div id="stats">
  <div class="stat win" id="s-win">
    <div class="count" id="count-win">0</div>
    <div class="label">WIN</div>
  </div>
  <div class="stat-divider"></div>
  <div class="stat draw" id="s-draw">
    <div class="count" id="count-draw">0</div>
    <div class="label">DRAW</div>
  </div>
  <div class="stat-divider"></div>
  <div class="stat loss" id="s-loss">
    <div class="count" id="count-loss">0</div>
    <div class="label">LOSS</div>
  </div>
</div>

<div id="game">
  <svg id="win-line" viewBox="0 0 100 100" preserveAspectRatio="none">
    <line x1="0" y1="0" x2="0" y2="0"/>
  </svg>
</div>

<div id="turn-badge">YOUR TURN</div>

<div id="settings-modal">
  <div class="settings-panel">
    <h2>الإعدادات</h2>
    <div class="row"><label>الذاكرة</label><span class="val" id="setting-states">—</span></div>
    <div class="row"><label>عدد الألعاب</label><span class="val" id="setting-games">—</span></div>
    <div class="row"><label>الحالة</label><span class="val" id="setting-status">—</span></div>
    <button id="reset-scores">تصفير النتائج</button>
  </div>
</div>

<script>
const BRAIN_URL = 'https://gist.githubusercontent.com/X5Coder/3c98d38e106fb1aba2a50b458df73545/raw/1b9d5aa0e220b3c17b72183287b201fbccff0377/gistfile1.txt';
const SCORES_KEY = 'xo_scores_v1';

const WIN_CONDS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function checkWin(board, player) {
  for (const c of WIN_CONDS) {
    if (board[c[0]] === player && board[c[1]] === player && board[c[2]] === player) return c;
  }
  return null;
}

const q = new Map();
let gamesPlayed = 0;
function getQ(state) {
  let v = q.get(state);
  if (!v) { v = new Float64Array(9); q.set(state, v); }
  return v;
}
function stateKey(board, player) {
  let s = '';
  for (let i = 0; i < 9; i++) {
    const c = board[i];
    if (c === ' ') s += '.';
    else if (c === player) s += 'X';
    else s += 'O';
  }
  return s;
}
function chooseAction(board, player, available) {
  const v = getQ(stateKey(board, player));
  let bestQ = -Infinity, best = [];
  for (const a of available) {
    if (v[a] > bestQ) { bestQ = v[a]; best = [a]; }
    else if (v[a] === bestQ) best.push(a);
  }
  return best[(Math.random() * best.length) | 0];
}
async function loadBrain() {
  try {
    const res = await fetch(BRAIN_URL, { cache: 'force-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!data.q) throw new Error('Invalid format');
    q.clear();
    for (const key in data.q) q.set(key, Float64Array.from(data.q[key]));
    gamesPlayed = data.gamesPlayed || 0;
    console.log('Brain: ' + q.size + ' states');
    return true;
  } catch (err) {
    console.error('Brain failed:', err);
    return false;
  }
}

const board = [' ',' ',' ',' ',' ',' ',' ',' ',' '];
let turn = 'X';
let playerSymbol = Math.random() < 0.5 ? 'X' : 'O';
let aiSymbol = playerSymbol === 'X' ? 'O' : 'X';
let gameOver = false;
let aiThinking = false;
let lastMove = -1;
let winLine = null;
let brainReady = false;
let clearing = false;

let roundStarter = Math.random() < 0.5 ? 'player' : 'ai';
let nextStarter = null;

turn = roundStarter === 'player' ? playerSymbol : aiSymbol;

const scores = { win: 0, draw: 0, loss: 0 };

function loadScores() {
  try {
    const raw = localStorage.getItem(SCORES_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (typeof data.win === 'number')  scores.win  = data.win;
    if (typeof data.draw === 'number') scores.draw = data.draw;
    if (typeof data.loss === 'number') scores.loss = data.loss;
  } catch (e) { }
}

function saveScores() {
  try {
    localStorage.setItem(SCORES_KEY, JSON.stringify(scores));
  } catch (e) { }
}

const statEls = {
  win:  document.getElementById('s-win'),
  draw: document.getElementById('s-draw'),
  loss: document.getElementById('s-loss')
};
const countEls = {
  win:  document.getElementById('count-win'),
  draw: document.getElementById('count-draw'),
  loss: document.getElementById('count-loss')
};

function paintScores() {
  countEls.win.textContent  = scores.win;
  countEls.draw.textContent = scores.draw;
  countEls.loss.textContent = scores.loss;
}

function updateScore(type) {
  countEls[type].textContent = scores[type];
  saveScores();
  const el = statEls[type];
  el.classList.remove('pulse');
  void el.offsetWidth;
  el.classList.add('pulse');
  setTimeout(() => el.classList.remove('pulse'), 400);
}

const turnBadge = document.getElementById('turn-badge');
let badgeText = '';

function setBadge(text, isYou) {
  if (badgeText === text && turnBadge.classList.contains('show')) {
    turnBadge.classList.toggle('you', isYou);
    return;
  }
  badgeText = text;
  turnBadge.textContent = text;
  turnBadge.classList.toggle('you', isYou);
  turnBadge.classList.add('show');
  turnBadge.classList.remove('swap');
  void turnBadge.offsetWidth;
  turnBadge.classList.add('swap');
}

function hideBadge() {
  badgeText = '';
  turnBadge.classList.remove('show', 'swap', 'you');
}

function updateTurnBadge() {
  if (!brainReady || gameOver || clearing) { hideBadge(); return; }
  if (turn === playerSymbol) setBadge('YOUR TURN', true);
  else                        setBadge('AI PLAY',   false);
}

function markX() {
  return '<div class="mark"><svg viewBox="0 0 100 100" fill="none">' +
    '<line x1="25" y1="25" x2="75" y2="75"/>' +
    '<line x1="75" y1="25" x2="25" y2="75"/>' +
    '</svg></div>';
}
function markO() {
  return '<div class="mark"><svg viewBox="0 0 100 100" fill="none">' +
    '<circle cx="50" cy="50" r="28"/>' +
    '</svg></div>';
}

const gameEl = document.getElementById('game');
const winLineSvg = document.getElementById('win-line');
const winLineEl = winLineSvg.querySelector('line');
const cells = [];

for (let i = 0; i < 9; i++) {
  const cell = document.createElement('div');
  cell.className = 'cell';
  cell.dataset.i = i;
  cell.addEventListener('click', () => onClick(i));
  gameEl.appendChild(cell);
  cells.push(cell);
}

function render() {
  for (let i = 0; i < 9; i++) {
    const cell = cells[i];
    const mark = board[i];
    const wasX = cell.classList.contains('x');
    const wasO = cell.classList.contains('o');
    const isX = mark === 'X';
    const isO = mark === 'O';

    cell.classList.remove('x', 'o', 'taken', 'win', 'last');

    if (isX) cell.classList.add('x', 'taken');
    else if (isO) cell.classList.add('o', 'taken');

    if (winLine && winLine.includes(i)) cell.classList.add('win');
    else if (lastMove === i) cell.classList.add('last');

    if (isX && !wasX) cell.innerHTML = markX();
    else if (isO && !wasO) cell.innerHTML = markO();
    else if (!isX && !isO && (wasX || wasO)) cell.innerHTML = '';
  }

  gameEl.classList.toggle('ai-turn', !gameOver && !clearing && turn === aiSymbol);
  updateTurnBadge();
}

function showWinLine(combo) {
  const gameRect = gameEl.getBoundingClientRect();
  const r1 = cells[combo[0]].getBoundingClientRect();
  const r3 = cells[combo[2]].getBoundingClientRect();

  const p1 = [
    (r1.left + r1.width  / 2 - gameRect.left) / gameRect.width  * 100,
    (r1.top  + r1.height / 2 - gameRect.top ) / gameRect.height * 100
  ];
  const p3 = [
    (r3.left + r3.width  / 2 - gameRect.left) / gameRect.width  * 100,
    (r3.top  + r3.height / 2 - gameRect.top ) / gameRect.height * 100
  ];

  const dx = p3[0] - p1[0];
  const dy = p3[1] - p1[1];
  const ext = 0.12;
  const x1 = p1[0] - dx * ext;
  const y1 = p1[1] - dy * ext;
  const x2 = p3[0] + dx * ext;
  const y2 = p3[1] + dy * ext;

  winLineEl.setAttribute('x1', x1);
  winLineEl.setAttribute('y1', y1);
  winLineEl.setAttribute('x2', x2);
  winLineEl.setAttribute('y2', y2);

  const len = Math.hypot(x2 - x1, y2 - y1) * 1.5;
  winLineEl.style.strokeDasharray  = len;
  winLineEl.style.strokeDashoffset = len;

  winLineSvg.classList.remove('show');
  void winLineSvg.offsetWidth;
  winLineSvg.classList.add('show');
  winLineEl.style.animation = 'none';
  void winLineEl.offsetWidth;
  winLineEl.style.animation = 'drawLine 0.3s ease-out forwards';
}

function hideWinLine() {
  winLineSvg.classList.remove('show');
  winLineEl.style.animation = 'none';
  winLineEl.style.strokeDashoffset = 500;
}

function finishRound(result, winningCombo) {
  gameOver = true;
  aiThinking = false;

  if (result === 'win') {
    scores.win++;
    updateScore('win');
    nextStarter = 'player';
  } else if (result === 'loss') {
    scores.loss++;
    updateScore('loss');
    nextStarter = 'ai';
  } else {
    scores.draw++;
    updateScore('draw');
    nextStarter = roundStarter === 'player' ? 'ai' : 'player';
  }

  render();

  if (winningCombo) {
    setTimeout(() => {
      winLine = winningCombo;
      render();
      showWinLine(winningCombo);
      setTimeout(startClearSequence, 1000);
    }, 220);
  } else {
    setTimeout(startClearSequence, 800);
  }
}

function onClick(i) {
  if (!brainReady || clearing) return;
  if (gameOver || aiThinking) return;
  if (turn !== playerSymbol) return;
  if (board[i] !== ' ') return;

  board[i] = playerSymbol;
  lastMove = i;
  render();

  const w = checkWin(board, playerSymbol);
  if (w) return finishRound('win', w);
  if (!board.includes(' ')) return finishRound('draw');

  turn = aiSymbol;
  aiThinking = true;
  render();
  setTimeout(aiPlay, 450);
}

function aiPlay() {
  if (gameOver || clearing) { aiThinking = false; return; }

  const available = [];
  for (let i = 0; i < 9; i++) if (board[i] === ' ') available.push(i);
  if (!available.length) { aiThinking = false; return; }

  const action = chooseAction(board, aiSymbol, available);
  board[action] = aiSymbol;
  lastMove = action;
  aiThinking = false;

  const w = checkWin(board, aiSymbol);
  if (w) return finishRound('loss', w);
  if (!board.includes(' ')) return finishRound('draw');

  turn = playerSymbol;
  render();
}

function startClearSequence() {
  if (clearing) return;
  clearing = true;

  hideWinLine();
  gameEl.classList.remove('ai-turn');
  hideBadge();

  for (let i = 0; i < 9; i++) cells[i].classList.add('cell-out');

  setTimeout(() => {
    for (let i = 0; i < 9; i++) {
      board[i] = ' ';
      cells[i].className = 'cell cell-in';
      cells[i].innerHTML = '';
    }

    playerSymbol = Math.random() < 0.5 ? 'X' : 'O';
    aiSymbol = playerSymbol === 'X' ? 'O' : 'X';

    if (nextStarter === 'player')      turn = playerSymbol;
    else if (nextStarter === 'ai')     turn = aiSymbol;
    else                                turn = Math.random() < 0.5 ? playerSymbol : aiSymbol;

    roundStarter = (turn === playerSymbol) ? 'player' : 'ai';
    nextStarter  = null;

    gameOver    = false;
    aiThinking  = false;
    lastMove    = -1;
    winLine     = null;
    clearing    = false;

    gameEl.classList.toggle('ai-turn', turn === aiSymbol);
    updateTurnBadge();

    setTimeout(() => {
      for (let i = 0; i < 9; i++) cells[i].classList.remove('cell-in');

      if (turn === aiSymbol) {
        aiThinking = true;
        setTimeout(aiPlay, 400);
      }
    }, 380);

  }, 180);
}

const modal = document.getElementById('settings-modal');
const settingsBtn = document.getElementById('settings-btn');
const resetBtn = document.getElementById('reset-scores');

settingsBtn.addEventListener('click', () => {
  document.getElementById('setting-states').textContent = q.size.toLocaleString();
  document.getElementById('setting-games').textContent  = gamesPlayed.toLocaleString();
  document.getElementById('setting-status').textContent = brainReady ? 'جاهز' : 'جاري التحميل';
  modal.classList.add('show');
});
modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('show'); });
resetBtn.addEventListener('click', () => {
  scores.win = 0; scores.draw = 0; scores.loss = 0;
  saveScores();
  paintScores();
});

loadScores();
paintScores();
render();
loadBrain().then(ok => {
  brainReady = true;
  console.log(ok ? 'Ready' : 'Playing without brain');
  updateTurnBadge();
});
</script>
</body>
</html>
